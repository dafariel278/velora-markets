<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Velora Markets</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="logo">VELORA</div>
  <nav>
    <a href="#">Markets</a>
    <a href="#">Trending</a>
    <a href="#">Gainers</a>
    <a href="#">Portfolio</a>
  </nav>
  <button class="btn-outline">Sign Up</button>
</header>

<section class="hero">
  <h1>Real-Time Crypto Intelligence</h1>
  <p>Institutional-grade digital asset tracking platform.</p>
  <div class="hero-buttons">
    <button class="btn-gold">Explore Markets</button>
    <button class="btn-dark">View Trending</button>
  </div>
</section>

<section class="market-table">
  <h2>Top Cryptocurrencies</h2>
  <input type="text" id="search" placeholder="Search coin..." />
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Coin</th>
        <th>Price</th>
        <th>24h %</th>
        <th>Market Cap</th>
      </tr>
    </thead>
    <tbody id="crypto-data">
    </tbody>
  </table>
</section>

<footer>
  <p>© 2026 Velora Markets. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
